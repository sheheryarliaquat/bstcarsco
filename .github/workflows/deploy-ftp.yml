name: Deploy static site to cPanel SFTP

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create .env.local from GitHub Secret
        run: |
          echo "${{ secrets.CLIENT_ENV }}" > .env.local
        shell: bash

      - name: Build static site (next export -> out/)
        run: npm run build

      - name: Deploy out/ to cPanel via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_SFTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: sftp
          port: ${{ secrets.FTP_SFTP_PORT }}
          local-dir: ./out/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
